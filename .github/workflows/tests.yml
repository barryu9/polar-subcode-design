name: Numerical checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/build_native.py --scl
      - run: python main.py verify-theory
      - run: python examples/n64_k32.py --output runs/ci_n64
