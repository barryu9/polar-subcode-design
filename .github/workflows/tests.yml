name: Numerical checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/build_native.py --scl
      - run: python main.py verify-theory
      - run: python -m theory.check_results
      - run: python -m paper_examples all
      - run: python -m reproduction check
      - run: python -m reproduction.table_ii_values
      - run: python main.py enumerate --support configs/proposed/n64_k32.code.json --cutoff 12 --method native --output runs/fig5-spectrum
